# VM-Computers Android (QEMU) 构建工作流
#
# 产物：
#   - mcvmcomputers-android-arm64.jar（FCL 可直接放入 mods 文件夹的 mod）
#     内含 assets/qemu/qemu-system-x86_64 与 assets/qemu/qemu-img
#     （静态 aarch64 ELF，Alpine 容器内构建，可在 Android 上直接运行）
#
# 触发：push 到 main / android-qemu-arm64 分支，或手动 workflow_dispatch
name: Android ARM64 QEMU Build
on:
  push:
    branches: [ main, android-qemu-arm64 ]
  workflow_dispatch:
jobs:
  build-qemu:
    name: Build static QEMU for Android ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build static QEMU in arm64 Alpine container (native arm64)
        run: |
          docker run --rm -v "$PWD":/build \
            -e QEMU_VERSION=8.2.4 \
            alpine:3.20 /bin/sh /build/.github/workflows/qemu-alpine-build.sh

      - name: Verify static aarch64 binary
        run: |
          file qemu-system-x86_64 qemu-img
          ls -lh qemu-system-x86_64 qemu-img

      - name: Upload QEMU binaries
        uses: actions/upload-artifact@v4
        with:
          name: qemu-android-arm64
          path: |
            qemu-system-x86_64
            qemu-img
          if-no-files-found: error

  build-mod:
    name: Build Fabric mod jar (with bundled QEMU)
    needs: build-qemu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 8
      - name: Download QEMU binaries
        uses: actions/download-artifact@v4
        with:
          name: qemu-android-arm64
          path: qemu-bin
      - name: Bundle QEMU into mod resources
        run: |
          mkdir -p src/main/resources/assets/qemu
          cp qemu-bin/qemu-system-x86_64 src/main/resources/assets/qemu/qemu-system-x86_64
          cp qemu-bin/qemu-img src/main/resources/assets/qemu/qemu-img
          chmod +x src/main/resources/assets/qemu/*
          ls -lh src/main/resources/assets/qemu/
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mcvmcomputers-android-arm64
          path: build/libs/*.jar
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          fail_on_unmatched_files: true
